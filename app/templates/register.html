{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<form class="narrow card" method="post" action="/register">
  <h2>Регистрация</h2>
  <label for="email">Email</label>
  <input id="email" type="email" name="email" value="{{ email or '' }}" required autofocus>
  <label for="password">Пароль (не короче 8 символов)</label>
  <input id="password" type="password" name="password" minlength="8" required>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button type="submit">Создать аккаунт</button>
  <p class="muted">Уже есть аккаунт? <a href="/login">Войдите</a></p>
</form>
{% endblock %}
