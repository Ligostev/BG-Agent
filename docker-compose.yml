# Запуск на сервере: cp .env.example .env, заполнить, затем docker compose up -d --build
services:
  web:
    build: .
    env_file: .env
    depends_on: [db, redis]
    volumes: [appdata:/srv/data]   # наборы открытых данных ФНС и копия реестра 19.28
    restart: unless-stopped

  worker:
    build: .
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    depends_on: [db, redis]
    volumes: [appdata:/srv/data]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bg
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
    restart: unless-stopped

volumes:
  appdata:
  pgdata:
  caddy_data:
